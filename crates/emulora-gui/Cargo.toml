[package]
name = "emulora-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "emulora-gui"
path = "src/main.rs"

[features]
precision-f64 = [
    "emulora-math/precision-f64",
    "emulora-core/precision-f64",
    "emulora-gpu/precision-f64",
]

[dependencies]
emulora-core.workspace = true
emulora-gpu.workspace = true
emulora-math.workspace = true
eframe.workspace = true
egui.workspace = true
image.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "0.15"
rayon.workspace = true
emulora-photo-input.workspace = true
raw-window-handle = "0.6"

# macOS-only: tag the CAMetalLayer's colorspace as sRGB so the OS
# colour-manages the window correctly on wide-gamut external displays.
# Without this, the framebuffer is treated as raw display primaries and
# sRGB content is rendered into the wider gamut → oversaturated reds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
core-graphics = "0.24"
foreign-types = "0.5"

[dev-dependencies]
tempfile = "3"
