name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUI and f32 CLI
        shell: pwsh
        run: |
          cargo build --release -p emulora-gui
          cargo build --release -p emulora-cli --bin emulora

      - name: Build f64 exporter
        shell: pwsh
        run: |
          cargo build --release -p emulora-cli --bin emulora-f64 --features precision-f64

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist\emulora-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target\release\emulora-gui.exe $dist\
          Copy-Item target\release\emulora.exe $dist\
          Copy-Item target\release\emulora-f64.exe $dist\
          Copy-Item -Recurse data $dist\data
          Copy-Item LICENSE, SPEKTRAFILM_DATA_LICENSE.txt, COLOUR_LICENSE.txt, THIRD_PARTY_NOTICES.md $dist\
          @"
          Emulora Windows x64

          Run emulora-gui.exe for the GUI.

          Backends:
          - The validated film-compute path uses Vulkan; GPU availability depends on the driver and build.

          f64 export:
          - emulora-f64.exe must stay next to emulora-gui.exe.
          - The GUI uses it for CPU f64 Export.
          "@ | Set-Content -Encoding UTF8 "$dist\README.txt"
          Compress-Archive -Path "$dist\*" -DestinationPath "dist\emulora-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulora-windows-x64
          path: dist/emulora-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/emulora-windows-x64.zip

  macos:
    name: macOS experimental package
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Package app bundle
        shell: bash
        run: |
          bash scripts/package_macos_app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulora-macos
          path: dist/emulora-macos.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/emulora-macos.zip
