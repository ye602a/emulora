[workspace]
resolver = "2"
members = [
    "crates/emulora-core",
    "crates/emulora-gpu",
    "crates/emulora-math",
    "crates/emulora-model",
    "crates/emulora-photo-input",
    "crates/emulora-cli",
    "crates/emulora-gui",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.99"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
emulora-photo-input = { path = "crates/emulora-photo-input" }
emulora-core = { path = "crates/emulora-core" }
emulora-gpu = { path = "crates/emulora-gpu" }
emulora-math = { path = "crates/emulora-math" }
emulora-model = { path = "crates/emulora-model" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
rand = "0.9"
rand_distr = "0.5"
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "glow", "default_fonts", "wayland", "x11"] }
egui = "=0.37.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
libm = "0.2"
rustfft = "6"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
